name: Flutter Web CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Pub get
        run: flutter pub get

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Tests + couverture
        run: |
          if [ -d test ] && compgen -G "test/*.dart" > /dev/null; then
            flutter test --coverage
            [ -f coverage/lcov.info ] && genhtml coverage/lcov.info -o coverage/html || true
          else
            echo "No tests found, skipping test & coverage."
            mkdir -p coverage && echo "TN:" > coverage/lcov.info
            mkdir -p coverage/html
          fi

      - name: Build Web (release)
        run: |
          flutter config --enable-web
          flutter build web --release

      # 📦 Artefacts
      - name: Upload build (web)
        uses: actions/upload-artifact@v4
        with:
          name: build-web
          path: build/web

      - name: Upload coverage (HTML)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html

      - name: Upload lcov.info
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
