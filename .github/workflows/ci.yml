name: Flutter Web CI & Vercel Deploy

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Pub get
        run: flutter pub get

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Tests + couverture
        run: |
          if [ -d test ] && compgen -G "test/*.dart" > /dev/null; then
            flutter test --coverage
            [ -f coverage/lcov.info ] && genhtml coverage/lcov.info -o coverage/html || true
          else
            echo "No tests found, skipping test & coverage."
            mkdir -p coverage && echo "TN:" > coverage/lcov.info
            mkdir -p coverage/html
          fi

      - name: Build Web (release)
        run: |
          flutter config --enable-web
          flutter build web --release
          # si un vercel.json existe à la racine, on le copie dans le build
          if [ -f vercel.json ]; then cp vercel.json build/web/; fi

      - name: Upload artifacts (coverage + build)
        uses: actions/upload-artifact@v4
        with:
          name: build-web
          path: build/web

      # ---------- Deploy Vercel ----------
      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Evite d'être (re)lié à une team: on supprime le lien local .vercel
      - name: Reset Vercel link
        run: rm -rf .vercel

      # ✅ Preview pour TOUTES les PR (ou push sur feature/**)
      - name: Deploy Preview to Vercel
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/')
        id: vercel_preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(vercel deploy build/web \
            --yes \
            --name flutter-todo-web \
            --scope julienesn \
            --token "$VERCEL_TOKEN")
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $URL"

      - name: Comment PR with Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const url = "${{ steps.vercel_preview.outputs.preview_url }}";
            if (!url) { core.warning('No preview URL found'); return; }
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `🚀 Preview déployée sur Vercel : ${url}`
            });

      # ✅ Prod uniquement sur PUSH vers main
      - name: Deploy Production to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(vercel deploy build/web \
            --prod \
            --yes \
            --name flutter-todo-web \
            --scope julienesn \
            --token "$VERCEL_TOKEN")
          echo "Prod URL: $URL"
